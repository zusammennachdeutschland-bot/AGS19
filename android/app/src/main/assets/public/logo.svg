<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft shadow for the pin -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
    
    <!-- Clip path for German flag inside pin -->
    <clipPath id="pin-clip">
      <path d="M 256 120 C 220 120 192 148 192 184 C 192 230 256 280 256 280 C 256 280 320 230 320 184 C 320 148 292 120 256 120 Z" />
    </clipPath>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#FFFFFF" />

  <!-- Pin Shadow -->
  <ellipse cx="256" cy="292" rx="32" ry="7" fill="#CBD5E1" />

  <!-- German Flag Map Pin -->
  <g filter="url(#shadow)">
    <!-- Base pin shape -->
    <path d="M 256 120 C 220 120 192 148 192 184 C 192 230 256 280 256 280 C 256 280 320 230 320 184 C 320 148 292 120 256 120 Z" fill="#111827" />
    
    <!-- Flag stripes clipped to pin -->
    <g clip-path="url(#pin-clip)">
      <!-- Black top stripe -->
      <rect x="180" y="120" width="152" height="54" fill="#111827" />
      <!-- Red middle stripe -->
      <rect x="180" y="174" width="152" height="54" fill="#DC2626" />
      <!-- Gold bottom stripe -->
      <rect x="180" y="228" width="152" height="54" fill="#F59E0B" />
    </g>
    <!-- Pin outline for sharpness -->
    <path d="M 256 120 C 220 120 192 148 192 184 C 192 230 256 280 256 280 C 256 280 320 230 320 184 C 320 148 292 120 256 120 Z" fill="none" stroke="#0F172A" stroke-width="3" />
  </g>

  <!-- Open Book Lines -->
  <g stroke="#0F172A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer left book border -->
    <path d="M 170 205 L 170 380 Q 213 388 256 380 Q 299 388 342 380 L 342 205" />
    
    <!-- Outer left page top -->
    <path d="M 170 205 Q 213 192 256 205 Q 299 192 342 205" />
    
    <!-- Inner left page lines -->
    <path d="M 186 182 L 186 360 Q 221 368 256 360 Q 291 368 326 360 L 326 182" />
    <path d="M 186 182 Q 221 168 256 182 Q 291 168 326 182" />
    
    <!-- Center spine -->
    <path d="M 256 182 L 256 380" />
    
    <!-- Bottom center connection curve -->
    <path d="M 235 381 Q 256 405 277 381" />
  </g>

  <!-- Text "AGS19" -->
  <text x="256" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="2">AGS19</text>
</svg>
