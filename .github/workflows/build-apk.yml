name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Force Clean Stale Build Artifacts
        run: |
          echo "Removing stale dist/ and android web assets..."
          rm -rf dist android/app/src/main/assets/public

      - name: Install Dependencies & Force Fix React-Is
        run: |
          npm install --legacy-peer-deps
          npm install react-is@19.0.0 --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Build Output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: Web build failed - dist/index.html missing!"
            exit 1
          fi
          echo "Web build successfully verified in dist/."

      - name: Generate Capacitor Assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android Asset Sync
        run: |
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERROR: Capacitor sync failed - android assets missing!"
            exit 1
          fi
          echo "Android public assets verified."

      - name: Fix Corrupt Gradle Wrapper & Build APK
        run: |
          # 1. Generate the wrapper in an empty temp directory (with a fake settings file)
          echo "Generating fresh gradle-wrapper.jar in isolated directory..."
          mkdir -p /tmp/gradle-fix
          cd /tmp/gradle-fix
          touch settings.gradle
          gradle wrapper --gradle-version 8.7
          
          # 2. Copy the fresh jar back into your repository
          echo "Copying fixed jar to Android directory..."
          cd $GITHUB_WORKSPACE/android
          cp /tmp/gradle-fix/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          
          # 3. Build the APK using the local, corrected 8.7 wrapper
          echo "Building APK with fixed wrapper..."
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK build failed - output file missing!"
            exit 1
          fi
          echo "APK successfully generated."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGS19-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
